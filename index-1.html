 if(p.burn>0)T('BURNING',101,31,6,'#ff7a1f');if(p.pois>0)T('POISONED',101,40,6,'#7ee03a');if(p.slow>0)T('CHILLED',101,49,6,'#9fe8ff');
 {const bars=[];

  T('VOLUME '+Math.round(vol*100)+'%',W/2,146,7,'#fff','center');U(35,155,122,10,'#0a0305');U(36,156,120,8,'#2a1216');U(36,156,120*vol,8,audioOn?'#4dd0ff':'#555');U(36+Math.round(vol*120)-2,152,5,16,'#fff');

function draw(){mX+=(mIdx-mX)*.14;drawWorld();ctx.imageSmoothingEnabled=false;ctx.drawImage(wc,0,0,W,H);drawUI();if(fade>0){ctx.globalAlpha=Math.min(1,fade);U(0,0,W,H,'#14060a');ctx.globalAlpha=1;fade-=.05}}

function inR(q,x,y,w,h){return q.x>=x&&q.x<=x+w&&q.y>=y&&q.y<=y+h}
function startGame(){saveRun=false;curSlot=-1;mode=MODES[mIdx].id;reset();fade=1.2;sfx('click')}
function startSlot(i){curSlot=i;saveRun=true;mode=saves[i]?(saves[i].mode||'classic'):slotMode[i];reset();if(saves[i])restore(saves[i]);fade=1.2;sfx('click')}
function retry(){if(saveRun)startSlot(curSlot);else startGame()}
function playPressed(){const m=MODES[mIdx];if(m.lock&&!unlocked){sfx('hurt');lockShake=14;return}if(m.id=='saves'){state='slots';sfx('click')}else if(m.dex){dexK=m.id=='mobdex'?0:1;dexI=0;state='dex';sfx('click')}else startGame()}
function toMenu(){saveSlot();state='title';mstick=astick=null;sfx('click')}
function togglePause(){if(state=='play'){saveSlot();state='pause';mstick=astick=null}else if(state=='pause')state='play';sfx('click')}
function setSlide(q){vol=Math.max(0,Math.min(1,(q.x-36)/120));setVol()}
addEventListener('keydown',e=>{initAudio();const k=e.key.length==1?e.key.toLowerCase():e.key;keys[k]=true;
 if(k.startsWith('Arrow')||k==' ')e.preventDefault();
 if((k=='Escape'||k=='p')&&(state=='play'||state=='pause'))togglePause();
 else if(state=='play'&&(k==' '||k=='Shift'))dashWant=true;
 else if(state=='pick'&&'123'.includes(k)&&cards[k-1])apply(cards[k-1]);
 else if(state=='dex'){const n=(dexK?CARDS:DEX).length;if(k=='ArrowLeft')dexI=(dexI+n-1)%n;else if(k=='ArrowRight')dexI=(dexI+1)%n;else if(k=='Escape'||k=='Enter'||k==' ')state='title'}
 else if(state=='title'){if(k=='ArrowLeft')mIdx=Math.max(0,mIdx-1);else if(k=='ArrowRight')mIdx=Math.min(MODES.length-1,mIdx+1);else if(k==' '||k=='Enter')playPressed()}
 else if(state=='over'&&(k==' '||k=='Enter'))retry()});
addEventListener('keyup',e=>{keys[e.key.length==1?e.key.toLowerCase():e.key]=false});
function pt(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
cv.addEventListener('pointerdown',e=>{
 e.preventDefault();initAudio();const q=pt(e);
 if(state=='title'){mDrag={x:q.x,id:e.pointerId};cv.setPointerCapture(e.pointerId);return}
 if(state=='dex'){const n=(dexK?CARDS:DEX).length;if(inR(q,36,228,120,22)){state='title';sfx('click')}else if(q.x<45&&q.y>70&&q.y<210){dexI=(dexI+n-1)%n;sfx('click')}else if(q.x>W-45&&q.y>70&&q.y<210){dexI=(dexI+1)%n;sfx('click')}return}
 if(state=='slots'){for(let i=0;i<3;i++){const x=16,y=52+i*52;
  if(saves[i]&&inR(q,x+122,y+6,32,16)){if(slotDel&&slotDel.i==i&&t-slotDel.t<150){saves[i]=null;persist();slotDel=null;sfx('hurt')}else{slotDel={i,t};sfx('click')}return}
  if(!saves[i]&&inR(q,x+92,y+6,64,16)){const ml=slotModes(),k=ml.indexOf(slotMode[i]);slotMode[i]=ml[(k+1)%ml.length];sfx('click');return}
  if(inR(q,x,y,160,44)){startSlot(i);return}}
  if(inR(q,36,222,120,22)){state='title';sfx('click')}return}
 if(state=='over'){if(inR(q,36,150,120,22))retry();else if(inR(q,36,182,120,22))toMenu();return}
 if(state=='pause'){
  if(inR(q,36,72,120,22))togglePause();
  else if(inR(q,36,102,120,22)){audioOn=!audioOn;setVol();saveSet();sfx('click')}
  else if(inR(q,28,146,136,28)){sliding=e.pointerId+1;cv.setPointerCapture(e.pointerId);setSlide(q)}
  else if(inR(q,36,184,120,22))toMenu();
  return}
 if(state=='pick'){cards.forEach((c,i)=>{const x=5+i*62;if(q.x>=x&&q.x<=x+58&&q.y>=64&&q.y<=212)apply(c)});return}
 if(state=='dying')return;
 if(inR(q,PB.x-4,PB.y-4,PB.w+8,PB.h+8)){togglePause();return}
 if(Math.hypot(q.x-BX,q.y-BY)<22){dashWant=true;return}
